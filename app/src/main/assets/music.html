<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PikoVK — Музыка</title>
<style>
  /* Тёмная тема в духе VK; вся вёрстка — свои элементы, ничего
     не внедряется в страницы VK (урок 1.3.21: кнопки-иконки
     накладывались на элементы трека) */
  :root{
    --bg:#141414; --bg2:#1c1c1e; --bg3:#262629; --line:#2f2f33;
    --tx:#e8e8ea; --tx2:#8b8b90; --acc:#71aaeb; --acc2:#4a76a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:14px/1.35 -apple-system,'Roboto','Segoe UI',sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* Верх: заголовок + поиск */
  .head{padding:10px 12px 8px; border-bottom:1px solid var(--line); background:var(--bg2);}
  .head .row{display:flex; align-items:center; gap:10px;}
  .head .logo{font-weight:700; font-size:15px; color:var(--tx); white-space:nowrap;}
  .head .logo span{color:var(--acc);}
  #q{
    flex:1; background:var(--bg3); border:1px solid var(--line); color:var(--tx);
    border-radius:18px; padding:8px 14px; font-size:14px; outline:none; min-width:0;
  }
  .tabs{display:flex; gap:6px; margin-top:9px;}
  .tab{
    padding:6px 14px; border-radius:15px; background:var(--bg3); color:var(--tx2);
    font-size:13px; cursor:pointer; border:none; user-select:none;
  }
  .tab.on{background:var(--acc2); color:#fff;}
  /* Список */
  #list{flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 0 12px; -webkit-overflow-scrolling:touch;}
  .trk{display:flex; align-items:center; padding:7px 12px; gap:10px; cursor:pointer;}
  .trk:active{background:var(--bg2);}
  /* 1.3.23 доработка-3: играющий трек видно сразу — полоса слева, цвет
     названия и анимированный эквалайзер вместо молчаливой подсветки фоном */
  .trk.cur{background:var(--bg3); box-shadow:inset 3px 0 0 var(--acc);}
  .trk.cur .tt{color:var(--acc);}
  .cov{
    width:46px; height:46px; border-radius:6px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;
  }
  .meta{flex:1; min-width:0;}
  .tt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;}
  .ar{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tx2); font-size:12.5px;}
  .trk.restricted .tt,.trk.restricted .ar{color:var(--tx2); opacity:.55;}
  .side{display:flex; align-items:center; gap:8px; flex:none;}
  .dur{color:var(--tx2); font-size:12px; font-variant-numeric:tabular-nums;}
  .br{
    color:var(--acc); font-size:10.5px; border:1px solid var(--acc);
    border-radius:8px; padding:1px 5px; opacity:.85;
  }
  /* 1.3.23 доработка-5: кнопка скачивания крупнее, овальная и у самого
     правого края строки (репорт владельца) */
  .dl{
    width:48px; height:34px; border-radius:17px; flex:none;
    background:var(--bg3); color:var(--acc); border:1px solid var(--acc2);
    font-size:19px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-right:-6px;
  }
  .dl:active{background:var(--acc2); color:#fff;}
  .eq{display:inline-flex; align-items:flex-end; gap:2px; height:14px; width:14px; flex:none;}
  .eq i{width:3px; background:var(--acc); animation:pulse 1s infinite ease-in-out;}
  .eq i:nth-child(2){animation-delay:.25s;} .eq i:nth-child(3){animation-delay:.5s;}
  /* кнопка отмены во вкладке «Загрузки» — та же овальная форма,
     но без сдвига к краю строки */
  .dlrow .dl{margin-right:0;}
  @keyframes pulse{0%,100%{height:4px;} 50%{height:14px;}}
  .msg{color:var(--tx2); text-align:center; padding:28px 16px; font-size:13.5px;}
  .msg b{color:var(--tx);}
  #cnt{color:var(--tx2); font-size:11px; text-align:center; padding:2px 0 0;}
  #toast{position:fixed; left:50%; bottom:150px; transform:translateX(-50%); background:rgba(20,20,20,.85); color:#fff; padding:8px 14px; border-radius:16px; font-size:13px; z-index:99; display:none; max-width:80%; text-align:center;}
  .trk.go{background:var(--bg3);}
  .pl{
    display:flex; align-items:center; gap:12px; padding:8px 12px; cursor:pointer;
  }
  .pl:active{background:var(--bg2);}
  .plcov{width:56px; height:56px; border-radius:8px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;}
  .pl .meta .tt{font-weight:600;}
  .back{
    display:none; border:none; background:var(--bg3); color:var(--tx);
    border-radius:15px; padding:6px 14px; font-size:13px; cursor:pointer;
  }
  /* «‹ ВК» — возврат к вкладке браузера (1.3.23 доработка) */
  .exit{
    border:none; background:var(--bg3); color:var(--tx); white-space:nowrap;
    border-radius:15px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .exit:active{background:var(--acc2); color:#fff;}
  /* Низ: плеер (репорт владельца) — строка 1: обложка+названия и номер
     трека справа; строка 2: ползунок с таймерами по краям; строка 3:
     кнопки по центру, единая система форм/цветов из --acc/--acc2 */
  #player{border-top:1px solid var(--line); background:var(--bg2); padding:8px 10px 12px;}
  .prow{display:flex; align-items:center; gap:10px;}
  .pcov{width:48px; height:48px; border-radius:8px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;}
  .pmeta{flex:1; min-width:0;}
  .ptt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:13px;}
  .par{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tx2); font-size:11.5px;}
  /* номер трека справа в первой строке — одной строкой с обрезкой,
     чтобы на узких экранах не выталкивал мета за край (цвет/шрифт — от .time) */
  #pno{max-width:64px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none;}
  /* строка 2: таймеры по краям ползунка */
  .srow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  #seek{flex:1; height:4px; -webkit-appearance:none; background:var(--bg3); border-radius:2px; outline:none; margin:0;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:7px; background:var(--acc);}
  .time{color:var(--tx2); font-size:11px; font-variant-numeric:tabular-nums;}
  /* строка 3: единая система кнопок — овальные pill (рамка --acc2,
     иконка --acc), big для навигации, main #bPlay залит --acc2 и самый
     крупный; off — только пониженная opacity, цвет не меняется */
  .pbtns{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .btn{
    flex:none; border:none; background:transparent; color:var(--acc); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .btn.pill{width:40px; height:34px; border-radius:17px; border:1px solid var(--acc2); font-size:15px;}
  .btn.big{width:44px; height:44px; border-radius:22px; font-size:19px;}
  .btn.main{width:54px; height:54px; border-radius:27px; background:var(--acc2); color:#fff; font-size:24px;}
  .btn.off{opacity:.45;}
  /* иконки — SVG с currentColor: эмодзи 🔁/🔀/▶ рендерятся системным
   * ЦВЕТНЫМ шрифтом (рыжие) и CSS-цветом не красятся — SVG красится
   * единым акцентом у всех кнопок (репорт владельца)
   */
  .btn svg{display:block;}
  /* вкладка «Загрузки» (1.3.23 доработка) */
  .dlrow{display:flex; align-items:center; gap:10px; padding:8px 12px;}
  .dlic{width:30px; height:30px; flex:none; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .dlbar{height:3px; background:var(--bg3); border-radius:2px; margin-top:5px; overflow:hidden;}
  .dlbar i{display:block; height:100%; background:var(--acc); border-radius:2px;}
</style>
</head>
<body>
  <div class="head">
    <div class="row">
      <button class="exit" id="exitTab" title="Вернуться к вкладке ВК">‹ ВК</button>
      <div class="logo">Piko<span>VK</span> Музыка</div>
      <button class="back" id="back">‹ Назад</button>
    </div>
    <div class="row" style="margin-top:9px;">
      <input id="q" type="search" placeholder="Поиск музыки…" autocomplete="off">
    </div>
    <div class="tabs">
      <button class="tab on" data-s="my">Моя музыка</button>
      <button class="tab" data-s="pl">Плейлисты</button>
      <button class="tab" data-s="sr">Поиск</button>
      <button class="tab" data-s="dl">Загрузки</button>
    </div>
  </div>

  <div id="cnt"></div>

  <div id="list"><div class="msg">Загрузка…</div></div>

  <div id="toast"></div>

  <div id="player">
    <div class="prow">
      <div class="pcov" id="pcov"></div>
      <div class="pmeta"><div class="ptt" id="ptt">—</div><div class="par" id="par"></div></div>
      <div class="time" id="pno" title="Номер в списке"></div>
    </div>
    <div class="srow">
      <div class="time" id="tcur">0:00</div>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <div class="time" id="tdur">0:00</div>
    </div>
    <div class="pbtns">
      <button class="btn pill" id="bDl" title="Скачать текущий трек"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
      <button class="btn pill" id="bGo" title="К играющему треку"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4zM11 2h2v4h-2zm0 16h2v4h-2zM2 11h4v2H2zm16 0h4v2h-4z"/></svg></button>
      <button class="btn big" id="bPrev" title="Назад"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="btn main" id="bPlay" title="Играть/пауза"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="btn big" id="bNext" title="Вперёд"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg></button>
      <button class="btn pill off" id="bRepeat" title="Повтор"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      <button class="btn pill off" id="bShuffle" title="Перемешать"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
    </div>
  </div>

<script>
'use strict';
// Экран «Музыка» PikoVK (1.3.23, доработка) — локальная копия идеи VK Music
// Player: свой плеер вне страниц VK, данные через мост VkbMusic (Kotlin).
// ОЧЕРЕДЬ ЖИВЁТ В СЛУЖБЕ (PlaybackService): страница один раз отдаёт список
// играбельных треков и номер выбранного (nativeQueue) — дальше служба сама
// играет, сама переходит по завершению/ошибке, сама ведёт next/prev из
// шторки и гарнитуры. Вкладка — пульт и дисплей: nativeShift/nativeMode,
// позицию присылает служба хуком __vkbMusicPos, смену трека — пушем
// __vkbMusicData({kind:'player'}). Кнопки «‹ ВК» и скачивания — тоже мост.

var state = {
  section: 'my',        // my | pl | sr | dl
  tracks: [],           // нормализованные треки текущего списка
  playlists: [],
  shuffle: false,
  repeat: 'default',    // default | all | one
  lastReq: 0,
  reqId: 0,
  reqKind: {},
  reqAt: {},           // время отправки запроса (сторож зависших)
  probing: {},         // пробы битрейта в полёте/готовы (rawId -> 1)
  probeFails: {},      // неудачные пробы битрейта (rawId -> счётчик, кап 2)
  // 1.3.23 доработка-3: кэш битрейтов по rawId — раньше ответ probe жил
  // только в DOM и пропадал при перерисовке списка (репорт владельца:
  // «качество аудио пропадает из списка»)
  br: {},
  openedPl: null,       // {owner, id, key, title}
  natPlaying: false,    // зеркало состояния службы (приходит с __vkbMusicPos)
  natHas: false,        // в службе есть трек (даже с чужой сессии вкладки)
  natPos: 0,            // последняя позиция из службы, сек
  natDur: 0,            // последняя длительность из службы, сек
  natRawId: '',         // какой трек играет в службе (для подсветки/скачивания)
  cardRawId: '',        // какой трек уже отрисован карточкой (страховка от потерянных пушей)
  chase: null           // бюджет догоняющей пагинации {rawId, left} для текущего трека
};

var searchTimer = null;

function $(id){ return document.getElementById(id); }
function fmt(t){
  t = Math.max(0, Math.round(t||0));
  var h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = t%60;
  var p = function(x){ return x>=10 ? ''+x : '0'+x; };
  return (h>0 ? h+':'+p(m) : m) + ':' + p(s);
}
function esc(s){
  return (''+(s||'')).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// Иконки play/pause/повтора — те же SVG, что в кнопках (currentColor):
// JS подменяет innerHTML при переключениях (эмодзи-вариант давал
// непредсказуемый системный цвет на части прошивок)
var IC = {
  play: '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  rep: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',
  rep1: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zM11.3 9.6l1.4-.8v5.4h-1.4v-3.6l-.8.4z"/></svg>'
};

// ------------------------------------------------------------------
// Запросы в Kotlin: единый канал ответа window.__vkbMusicData
// ------------------------------------------------------------------
function ask(kind, extra, cb){
  var id = ++state.reqId;
  state.reqKind[id] = cb;
  state.reqAt[id] = Date.now();
  var p = extra || {};
  p.reqId = id;
  try{
    if (kind==='tracks') window.VkbMusic.load(p.offset|0, id, p.append?1:0);
    else if (kind==='search') window.VkbMusic.search(p.q||'', p.offset|0, id, p.append?1:0);
    else if (kind==='playlists') window.VkbMusic.playlists(p.offset|0, id, p.append?1:0);
    else if (kind==='pltracks') window.VkbMusic.pltracks(JSON.stringify({owner:p.owner,id:p.id,key:p.key,offset:p.offset|0}), id, p.append?1:0);
    else if (kind==='probe') window.VkbMusic.probe(p.rawId, p.url, p.hls?1:0, p.duration|0, id);
  }catch(e){
    // мост недоступен — колбэк всё равно должен прийти, иначе busy
    // пагинации зависнет навсегда (fail-open)
    delete state.reqKind[id];
    delete state.reqAt[id];
    if (cb) cb(false, [], 'Мост недоступен', 0);
  }
}

window.__vkbMusicData = function(r){
  if(!r) return;
  var cb = state.reqKind[r.reqId];
  if (r.kind==='bitrate'){
    delete state.reqKind[r.reqId];
    delete state.reqAt[r.reqId];
    // кэшируем: перерисовка списка (переход разделов, назад, пагинация)
    // не должна терять уже узнанное качество
    if (r.kbps) state.br[r.rawId] = r.kbps;
    else if (r.kbps === 0){
      // неудача пробы: снимаем флаг — строка перепробуется при следующем
      // показе, но не более 2 раз за сессию (против вечных проб мёртвых ссылок)
      delete state.probing[r.rawId];
      state.probeFails[r.rawId] = (state.probeFails[r.rawId] || 0) + 1;
    }
    var el = document.querySelector('[data-raw="'+r.rawId+'"] .br');
    if (el && r.kbps){ el.textContent = (r.kbps<=200?'~'+r.kbps:r.kbps)+'k'; }
    return;
  }
  if (r.kind==='tracks' && cb){ delete state.reqKind[r.reqId]; delete state.reqAt[r.reqId]; cb(r.ok, r.items||[], r.error||'', r.raw|0, r.total|0); return; }
  if (r.kind==='playlists' && cb){ delete state.reqKind[r.reqId]; delete state.reqAt[r.reqId]; cb(r.ok, r.items||[], r.error||'', r.raw|0, r.total|0); return; }
  if (r.kind==='player'){
    // пуш состояния службы (смена трека / syncPlayer): карточка снизу
    // оживает даже на пересобранной вкладке — очередь теперь в службе
    if (!r.has) return;
    state.natHas = true;
    state.natPlaying = !!r.playing;
    state.natPos = r.pos||0;
    state.natDur = r.dur||0;
    state.tickAt = Date.now();
    state.natRawId = r.rawId || '';
    // карточка этого трека уже отрисована этим пушом — тикам можно верить
    state.cardRawId = state.natRawId;
    $('ptt').textContent = r.title || '—';
    $('par').textContent = r.artist || '';
    $('pcov').style.backgroundImage = r.cover ? "url('" + r.cover + "')" : 'none';
    $('bPlay').innerHTML = r.playing ? IC.pause : IC.play;
    // режимы — служба источник истины (шаффл/повтор переживают вкладку)
    if (r.shuffle !== undefined){
      state.shuffle = !!r.shuffle;
      $('bShuffle').className = 'btn pill' + (state.shuffle ? ' on' : ' off');
    }
    if (r.repeat !== undefined){
      state.repeat = r.repeat || 'default';
      $('bRepeat').innerHTML = state.repeat==='one' ? IC.rep1 : IC.rep;
      $('bRepeat').className = 'btn pill' + (state.repeat==='default' ? ' off' : ' on');
    }
    var d = r.dur||0;
    if (d > 0){
      $('tdur').textContent = fmt(d);
      // scrub: пока пользователь тянет ползунок — позицию службы не рисуем
      if (!scrub){
        $('seek').value = Math.min(1000, Math.max(0, Math.round(1000 * (r.pos||0) / d)));
        $('tcur').textContent = fmt(r.pos||0);
      }
    }
    // подсветить строку текущего трека, если она в списке
    if (r.rawId) refreshCur();
    return;
  }
};

// ------------------------------------------------------------------
// Списки
// ------------------------------------------------------------------
function setMsg(html){
  $('list').innerHTML = '<div class="msg">'+html+'</div>';
}

function trackRowHtml(t, idx){
  var restricted = t.restricted ? ' restricted' : '';
  var cov = t.cover ? ' style="background-image:url(\'' + t.cover + '\')"' : '';
  // эквалайзер у играющего трека (владелец: «в списке не понятно, какой
  // трек играет»); битрейт из кэша state.br — качество не пропадает
  // при перерисовке списка
  var isCur = t.rawId && t.rawId === state.natRawId;
  var kbps = state.br[t.rawId];
  var brHtml = kbps ? ((kbps<=200?'~'+kbps:kbps)+'k') : '';
  return '<div class="trk'+restricted+'" data-i="'+idx+'" data-raw="'+esc(t.rawId)+'" data-restricted="'+(t.restricted?1:0)+'">'
    + '<div class="cov"'+cov+'></div>'
    + '<div class="meta"><div class="tt">'+esc(t.title)+'</div>'
    + '<div class="ar">'+esc(t.artist)+'</div></div>'
    + '<div class="side">'
    + '<span class="eq"'+(isCur?'':' style="display:none"')+'><i></i><i></i><i></i></span>'
    + '<span class="br" data-br>'+brHtml+'</span>'
    + '<span class="dur">'+fmt(t.duration)+'</span>'
    + (t.restricted ? '' : '<button class="dl" data-dl="'+idx+'" title="Скачать">⤓</button>')
    + '</div></div>';
}

// 1.3.23 доработка-2: пагинация по паттерну PinoK (AudioLibraryPager):
// у каждого списка свой serverOffset (сдвигается на размер СЫРОЙ страницы,
// а не на число показанных треков — нормализация может отбрасывать записи),
// флаг «есть ещё» (конец списка = пустая сырая страница) и флаг «запрос
// в полёте» (защита от дублей при медленной сети — раньше таймер 1.5 с
// снимал блокировку вслепую, и дважды уходил запрос с тем же offset).
var pg = {
  my:   { off: 0, more: true, busy: false, dups: 0, bg: 1 },
  sr:   { off: 0, more: true, busy: false, dups: 0 },
  pl:   { off: 0, more: true, busy: false, dups: 0 },
  pltr: { off: 0, more: true, busy: false, dups: 0, bg: 1 }
};

// «Штамп» текущего вида: растёт при каждой смене раздела/открытии плейлиста/
// новом поиске. Каждый запрос запоминает штамп (p.stamp) — ответ с чужим
// штампом обновит только счётчики пагинации, DOM — нет (иначе поздний ответ
// старого раздела перерисует текущий вид)
state.view = 0;

function clearPgTimers(p){
  if (p.timer) clearTimeout(p.timer);
  if (p.retryTimer) clearTimeout(p.retryTimer);
  if (p.parkTimer) clearTimeout(p.parkTimer);
  p.timer = null; p.retryTimer = null; p.parkTimer = null;
}
function resetPg(p){
  clearPgTimers(p);
  p.off = 0; p.more = true; p.busy = false; p.dups = 0; p.total = 0;
  p.fails = 0; p.hops = 0; p.parkMs = 0;
}

// 1.3.23 доработка-8 — порт фонового пейджера PinoK (#AUDIO-BG-PAGER).
// Список «Моя музыка» (и треки открытого плейлиста) догружается САМ,
// страница за страницей с паузами, пока сервер не скажет «конец», — без
// привязки к скроллу (репорт владельца: «пагинация должна работать как
// в PinoK»). Скролл к дну/незаполненный экран только «пинает» (kick —
// ожидаемая пауза сокращается). Конец списка НЕ смертелен (парковка с
// перепроверкой хвоста), сбой страницы — ретрай с бэкоффом, дыра листинга
// — прыжок +1. Константы — как в PinoK: PAUSE_BETWEEN_PAGES_MS=1500,
// MAX_DUP_PAGES_IN_ROW=20, MAX_HOLE_HOPS_IN_ROW=25, PARK_RECHECK 10с→5мин,
// бэкофф ретраев 3с/6с/12с с капом 60с
var BG_PAUSE_MS = 1500;
var HOP_PAUSE_MS = 400;
var RETRY_BASE_MS = 3000;
var RETRY_MAX_MS = 60000;
var MAX_DUPS_BG = 20;
var MAX_HOPS = 25;
var PARK_BASE_MS = 10000;
var PARK_MAX_MS = 300000;
var REQ_TIMEOUT_MS = 25000;

// Живёт ли блок пагинации в текущем виде: фоновая цепочка гоняет только
// СВОЙ список (иначе страницы «моей музыки» попали бы в выдачу поиска)
function pgLive(p){
  if (state.openedPl) return p === pg.pltr;
  if (state.section === 'my') return p === pg.my;
  if (state.section === 'sr') return p === pg.sr;
  if (state.section === 'pl') return p === pg.pl;
  return false;
}
// Очередной фоновый шаг: одна страница. Скрытая вкладка / запрос в полёте —
// шаг откладывается, цепочку продолжит этот же таймер
function bgNext(p){
  if (!pgLive(p)) return;
  if (document.hidden){ scheduleBg(p, 2000); return; }
  if (p.busy){ scheduleBg(p, 600); return; }
  loadMore();
}
function scheduleBg(p, ms){
  if (p.timer) clearTimeout(p.timer);
  p.timer = setTimeout(function(){ p.timer = null; bgNext(p); }, ms);
}
// Ретрай после сбоя страницы: бэкофф 3с → 6с → 12с → … кап 60с. Это НЕ
// «конец списка» — раньше сбой середины навсегда останавливал пагинацию
function scheduleRetry(p){
  p.fails = (p.fails || 0) + 1;
  var wait = Math.min(RETRY_BASE_MS * Math.pow(2, p.fails - 1), RETRY_MAX_MS);
  setFoot('note', 'Ошибка загрузки — повторяю попытки…');
  // гасим poll-таймер bgNext: иначе он выстрелит раньше бэкоффа
  if (p.timer) clearTimeout(p.timer);
  p.timer = null;
  if (p.retryTimer) clearTimeout(p.retryTimer);
  p.retryTimer = setTimeout(function(){ p.retryTimer = null; bgNext(p); }, wait);
}
// Парковка «конца списка» (PinoK): хвост периодически перепроверяется —
// подхватятся новые треки, самолечение сбоя; интервал ×2 от 10с до капа
// 5 мин (на честом конце это один дешёвый запрос в 10с…5мин, не спам)
function park(p){
  p.more = false;
  if (!pgLive(p)) return; // раздел покинут: перезагрузится через loadSection
  if (p.parkTimer) clearTimeout(p.parkTimer);
  p.parkMs = Math.min(p.parkMs ? p.parkMs * 2 : PARK_BASE_MS, PARK_MAX_MS);
  p.parkTimer = setTimeout(function(){
    p.parkTimer = null;
    if (!pgLive(p) || p.busy) return;
    // тихая перепроверка (PinoK: не поднимать «Загрузка…» в футере):
    // непустая страница оживит цепочку, пустая — конец снова
    p.more = true;
    loadMore(true);
  }, p.parkMs);
}

// Счётчик «прогружено» — над списком. VK отдаёт общее число не для всех
// списков (и врёт в count при дозагрузке), поэтому «из M» рисуем только
// когда M пришло из моста и список уже догрузился до конца или M >= N
function updateCnt(){
  updateTrackNo(); // счётчик на плеере живёт теми же переключениями списка
  var el = $('cnt');
  if (state.section === 'dl'){ el.textContent = ''; return; }
  var p = pg.my, n = state.tracks.length, label = 'Прогружено';
  if (state.openedPl) p = pg.pltr;
  else if (state.section === 'pl'){ p = pg.pl; n = state.playlists.length; label = 'Плейлистов'; }
  else if (state.section === 'sr') p = pg.sr;
  var tot = p.total | 0;
  if (!n && !tot){ el.textContent = ''; return; }
  // «из M» честно только когда M не меньше показанного (иначе VK насчитал лишнего)
  if (tot >= n && tot > 0){
    el.textContent = label + ': ' + n + ' из ' + tot;
  } else {
    el.textContent = label + ': ' + n;
  }
}

// 1.3.23 доработка-5: счётчик номера трека на плеере («4 / 231») — где
// играющий трек в открытом списке. Знаменатель — прогружено, а если мост
// отдал честный total и он больше — всего. Играющего нет в открытом
// списке — счётчик пустой (репорт владельца: «на плеере нет номера трека»)
function updateTrackNo(){
  var el = $('pno');
  if (!state.natRawId || !state.tracks.length){ el.textContent = ''; return; }
  var idx = -1;
  for (var i=0;i<state.tracks.length;i++){
    var t = state.tracks[i];
    if (t && t.rawId === state.natRawId){ idx = i; break; }
  }
  if (idx < 0){ el.textContent = ''; return; }
  var p = pg.my;
  if (state.openedPl) p = pg.pltr;
  else if (state.section === 'sr') p = pg.sr;
  var den = state.tracks.length;
  var tot = p.total | 0;
  if (tot > den) den = tot;
  el.textContent = (idx + 1) + ' / ' + den;
}

// Лёгкий тост (не мешает списку): переход к треку, ошибки
var toastTimer = null;
function toast(s){
  var el = $('toast');
  el.textContent = s;
  el.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 2000);
}

// Кнопка «⌖» — прокрутить открытый список к играющему треку (как в VK)
function scrollToCur(){
  if (!state.natRawId){ toast('Ничего не играет'); return; }
  var rows = document.querySelectorAll('#list .trk');
  var row = null;
  for (var i=0; i<rows.length; i++){
    if (rows[i].getAttribute('data-raw') === state.natRawId){ row = rows[i]; break; }
  }
  if (!row){ toast('Трека нет в открытом списке'); return; }
  row.scrollIntoView({block:'center', behavior:'smooth'});
  row.className = row.className.indexOf('go') >= 0 ? row.className : row.className + ' go';
  setTimeout(function(){ row.className = row.className.replace(/\s*go\b/, ''); }, 1600);
}

// Ошибка ПЕРВОЙ страницы: сообщение + кнопка «Повторить» (паттерн
// PagingFooter из PinoK — раньше восстановление было только сменой вкладки)
function showErrorRetry(err){
  setMsg(esc(err || 'Не удалось загрузить'));
  var btn = document.createElement('button');
  btn.className = 'back';
  btn.style.display = 'inline-block';
  btn.style.marginTop = '10px';
  btn.textContent = 'Повторить';
  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    retryFresh();
  });
  $('list').appendChild(btn);
}

// Повтор первой страницы. Плейлист обрабатываем особо: loadSection закрыл
// бы его (state.openedPl = null), а тут надо перезапросить ИМЕННО его треки;
// для остальных разделов достаточно loadSection
function retryFresh(){
  if (state.openedPl){
    var o = state.openedPl;
    state.view++;
    resetPg(pg.pltr);
    pg.pltr.stamp = state.view;
    setMsg('Загрузка плейлиста…');
    pg.pltr.busy = true;
    ask('pltracks', {owner:o.owner, id:o.id, key:o.key, offset:0},
      function(ok, items, err, raw, total){ onTracks(pg.pltr, ok, items, err, raw, 'Плейлист пуст', total); });
    return;
  }
  loadSection();
}

function removeFoot(){
  var old = document.getElementById('moreFoot');
  if (old && old.parentNode) old.parentNode.removeChild(old);
}

// Футер списка (паттерн PagingFooter из PinoK): «Загрузка…» / ошибка с
// кнопкой «Повторить» / «Это все треки». Вместо стирания всего списка
// надписью «Загрузка…» при каждой дозагрузке
function setFoot(mode, err, endLabel){
  removeFoot();
  if (mode === 'none') return;
  var div = document.createElement('div');
  div.id = 'moreFoot';
  if (mode === 'busy'){
    div.innerHTML = '<div class="msg" style="padding:14px;">Загрузка…</div>';
  } else if (mode === 'note'){
    // авто-ретрай фонового списка: текст без кнопки — повтор сам
    div.innerHTML = '<div class="msg" style="padding:14px;">' + esc(err || 'Загрузка…') + '</div>';
  } else if (mode === 'end'){
    div.innerHTML = '<div class="msg" style="padding:14px;">' + esc(endLabel || 'Это все треки') + '</div>';
  } else {
    div.innerHTML = '<div class="msg" style="padding:14px;">' + esc(err || 'Ошибка загрузки')
      + '<button class="back" id="moreRetry" style="display:inline-block;margin:8px 0 0;">Повторить</button></div>';
  }
  $('list').appendChild(div);
  var btn = document.getElementById('moreRetry');
  if (btn) btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    loadMore();
  });
}

// Дозагрузка следующей страницы ТЕКУЩЕГО списка. Все блокировки — здесь:
// нет «ещё» или запрос уже летит — тихо выходим
// quiet — тихий запрос парковки: футер «Загрузка…» не показываем (PinoK:
// перепроверка хвоста не должна мигать в UI)
function loadMore(quiet){
  if (state.section === 'dl') return;
  var p = pg.pltr;
  if (state.openedPl){
    if (!p.more || p.busy) return;
    p.busy = true;
    p.stamp = state.view;
    if (!quiet) setFoot('busy');
    var o = state.openedPl;
    ask('pltracks', {owner:o.owner, id:o.id, key:o.key, offset:p.off, append:1},
      function(ok, items, err, raw, total){ onTracks(p, ok, items, err, raw, 'Плейлист пуст', total); });
    return;
  }
  if (state.section === 'my'){
    p = pg.my;
    if (!p.more || p.busy) return;
    p.busy = true;
    p.stamp = state.view;
    if (!quiet) setFoot('busy');
    ask('tracks', {offset:p.off, append:1},
      function(ok, items, err, raw, total){ onTracks(p, ok, items, err, raw, 'Список пуст', total); });
  } else if (state.section === 'sr'){
    p = pg.sr;
    if (!p.more || p.busy) return;
    var q = $('q').value.trim();
    if (!q) return;
    p.busy = true;
    p.stamp = state.view;
    if (!quiet) setFoot('busy');
    ask('search', {q:q, offset:p.off, append:1},
      function(ok, items, err, raw, total){ onTracks(p, ok, items, err, raw, 'Ничего не найдено', total); });
  } else if (state.section === 'pl'){
    p = pg.pl;
    if (!p.more || p.busy) return;
    p.busy = true;
    p.stamp = state.view;
    if (!quiet) setFoot('busy');
    ask('playlists', {offset:p.off, append:1},
      function(ok, items, err, raw, total){ onPlaylists(p, ok, items, err, raw, total); });
  }
}

// Приём страницы треков. p — конкретный блок пагинации (захвачен на момент
// запроса: ответ устаревшего раздела не спутается с текущим). emptyMsg —
// текст для пустого списка этого раздела
function onTracks(p, ok, items, err, raw, emptyMsg, total){
  // устаревший ответ (раздел уже покинут, набран новый запрос): DOM не
  // трогаем и busy живого запроса не трогаем — иначе скролл успеет отправить
  // дубль до прихода актуального ответа
  if (p.stamp !== state.view) return;
  p.busy = false;
  if (total > 0) p.total = total; // общее число от VK (не всегда приходит)
  if (!ok){
    if (p.off === 0){
      showErrorRetry(err || 'Не удалось загрузить');
      // фоновому списку кнопку дублирует авто-ретрай (как в PinoK):
      // повтор придёт сам, ручная кнопка остаётся на случай нетерпения
      if (p.bg) scheduleRetry(p);
    } else if (p.bg){
      // сбой СЕРЕДИНЫ списка — НЕ конец (PinoK: пустой/сбойный ответ при
      // гейте/сети навсегда убивал пагинацию): ретрай с бэкоффом
      scheduleRetry(p);
    } else {
      setFoot('err', err || 'Не удалось загрузить ещё страницу');
    }
    updateCnt();
    return;
  }
  p.fails = 0; // страница прошла — бэкофф сброшен
  var wasFresh = (p.off === 0);
  if (raw <= 0){
    // пустая СЫРАЯ страница — ТРИ разных ситуации (PinoK #AUDIO-PAGING-HOLE,
    // прецедент стопа 149/3239): VK режет листинг на «битой» записи, и окно,
    // начинающееся с неё, приходит пустым. offset < total → прыжок +1 через
    // дыру; иначе честный конец списка
    if (p.bg && p.hops < MAX_HOPS && (p.total|0) > 0 && p.off < (p.total|0)){
      p.hops++;
      p.off++;
      setFoot('busy');
      scheduleBg(p, HOP_PAUSE_MS);
      updateCnt();
      return;
    }
    // ok=true, пусто и без count (PinoK: маркер ситуативного сбоя, не конец)
    // при off>0 — ретрай с бэкоффом; после 5 неудач признаём конец
    if (p.bg && p.off > 0 && (p.total|0) <= 0 && (p.fails || 0) < 5){
      scheduleRetry(p);
      updateCnt();
      return;
    }
    p.hops = 0;
    p.more = false;
    if (state.tracks.length){
      setFoot('end');
      if (p.bg) park(p); // конец не навсегда: хвост перепроверяется (PinoK)
    } else {
      setMsg(emptyMsg || 'Список пуст');
      // пустая библиотека тоже паркуется (PinoK): добавленные с другого
      // устройства треки подтянутся сами, без перезахода в раздел
      if (p.bg) park(p);
    }
    updateCnt();
    return;
  }
  p.hops = 0;
  p.parkMs = 0; // страница прошла — интервал парковки снова с базы
  p.off += raw;
  // дедуп по rawId (в PinoK — ключ ownerId_id): VK иногда отдаёт
  // перекрывающиеся окна, а дубли в списке = «пагинация сломана»
  var seen = {};
  var i, t;
  for (i=0;i<state.tracks.length;i++){
    t = state.tracks[i];
    if (t && t.rawId) seen[t.rawId] = 1;
  }
  var fresh = [];
  for (i=0;i<items.length;i++){
    t = items[i];
    if (!t || !t.rawId || seen[t.rawId]) continue;
    seen[t.rawId] = 1;
    fresh.push(t);
  }
  if (!fresh.length){
    // страница целиком из дубликатов: после N таких подряд признаём конец
    // списка (паттерн PinoK — защита от листания одного окна по кругу;
    // для фонового списка кап как в PinoK — 20 страниц подряд)
    p.dups++;
    if (p.dups >= (p.bg ? MAX_DUPS_BG : 3)) p.more = false;
  } else {
    p.dups = 0;
  }
  var from = state.tracks.length;
  for (i=0;i<fresh.length;i++) state.tracks.push(fresh[i]);
  // Прыжок через дыру на ПЕРВОЙ странице (находка ревью): renderTracksFresh
  // для этого вида ещё не звался, в #list висит setMsg «Загрузка…» — append
  // влепил бы строки ПОД надпись. Если строк в DOM ещё нет — рисуем как
  // свежий список (находит renderTracksAppend сам)
  if (wasFresh || !document.querySelector('#list .trk')){
    if (!state.tracks.length){ setMsg(emptyMsg || 'Список пуст'); updateCnt(); return; }
    renderTracksFresh();
  } else if (fresh.length){
    renderTracksAppend(from);
  }
  if (!p.more){
    setFoot('end');
    if (p.bg) park(p);
  } else {
    removeFoot();
  }
  updateCnt();
  // Пагинация живёт сама (репорт владельца «как в PinoK»): фоновые списки
  // (моя музыка, треки открытого плейлиста) тянут следующую страницу через
  // паузу БЕЗ привязки к скроллу — библиотека грузится целиком; поиск и
  // плейлисты — как раньше: цепочка только до заполнения экрана
  if (p.more){
    if (p.bg) scheduleBg(p, BG_PAUSE_MS);
    else setTimeout(autoLoad, 250);
  }
}

// Приём страницы плейлистов (та же механика, отдельный блок pg.pl)
function onPlaylists(p, ok, items, err, raw, total){
  // устаревший ответ — DOM и busy не трогаем (см. onTracks)
  if (p.stamp !== state.view) return;
  p.busy = false;
  if (total > 0) p.total = total;
  if (!ok){
    if (p.off === 0) showErrorRetry(err || 'Не удалось загрузить');
    else setFoot('err', err || 'Не удалось загрузить ещё страницу', 'Это все плейлисты');
    updateCnt();
    return;
  }
  var wasFresh = (p.off === 0);
  if (raw <= 0){
    p.more = false;
    if (state.playlists.length) setFoot('end', '', 'Это все плейлисты');
    else setMsg('Плейлистов нет');
    updateCnt();
    return;
  }
  p.off += raw;
  var seen = {};
  var i, pl;
  for (i=0;i<state.playlists.length;i++){
    pl = state.playlists[i];
    if (pl && pl.id) seen[pl.owner_id + '_' + pl.id] = 1;
  }
  var fresh = [];
  for (i=0;i<items.length;i++){
    pl = items[i];
    if (!pl || !pl.id || seen[pl.owner_id + '_' + pl.id]) continue;
    seen[pl.owner_id + '_' + pl.id] = 1;
    fresh.push(pl);
  }
  if (!fresh.length){
    p.dups++;
    if (p.dups >= 3) p.more = false;
  } else {
    p.dups = 0;
  }
  var from = state.playlists.length;
  for (i=0;i<fresh.length;i++) state.playlists.push(fresh[i]);
  renderPlaylists(from);
  if (!p.more) setFoot('end', '', 'Это все плейлисты');
  else removeFoot();
  updateCnt();
  if (p.more) setTimeout(autoLoad, 250);
}

// Свежая загрузка раздела: сброс пагинации раздела и запрос первой страницы
function loadSection(){
  if (state.section === 'dl'){ lastDlSnap = ''; updateCnt(); renderDownloads(); return; }
  // закрытый плейлист при любом входе в раздел — иначе поиск из открытого
  // плейлиста будет дозагружать ТРЕКИ ПЛЕЙЛИСТА в поисковую выдачу
  // (loadMore первым проверяет openedPl; блокер с ревью №2)
  state.openedPl = null;
  $('back').style.display = 'none';
  state.view++;
  var p = pg.my;
  if (state.section === 'sr') p = pg.sr;
  else if (state.section === 'pl') p = pg.pl;
  resetPg(p);
  // Списки раздела сбрасываем ВСЕГДА: иначе старые плейлисты попадут в
  // дедуп первого запроса (fresh = пусто) и после «назад» из плейлиста
  // экран навсегда залипнет на «Загрузка…» (регрессия найдена ревью)
  state.tracks = [];
  state.playlists = [];
  p.stamp = state.view;
  setMsg('Загрузка…');
  updateCnt(); // счётчик ждёт первой страницы (числа придут с ней)
  p.busy = true;
  if (state.section === 'my'){
    ask('tracks', {offset:0, append:0},
      function(ok, items, err, raw, total){ onTracks(p, ok, items, err, raw, 'Список пуст', total); });
  } else if (state.section === 'sr'){
    var q = $('q').value.trim();
    if (!q){ p.busy = false; setMsg('Введите запрос'); return; }
    ask('search', {q:q, offset:0, append:0},
      function(ok, items, err, raw, total){ onTracks(p, ok, items, err, raw, 'Ничего не найдено', total); });
  } else {
    ask('playlists', {offset:0, append:0},
      function(ok, items, err, raw, total){ onPlaylists(p, ok, items, err, raw, total); });
  }
}

// Подсветка играющего трека после (пере)рисования строк — класс .cur
// иначе терялся до следующего пуша службы (находка ревью)
function refreshCur(){
  if (!state.natRawId) return;
  var rows = document.querySelectorAll('#list .trk');
  for (var i=0; i<rows.length; i++){
    var on = rows[i].getAttribute('data-raw') === state.natRawId;
    rows[i].className = 'trk' + (on ? ' cur' : '')
      + (rows[i].getAttribute('data-restricted')==='1' ? ' restricted' : '');
    // эквалайзер: показываем только у играющего трека
    var eq = rows[i].querySelector('.eq');
    if (eq) eq.style.display = on ? 'inline-flex' : 'none';
  }
  updateTrackNo();
}

// Полная перерисовка первой страницы списка треков
function renderTracksFresh(){
  var html = '';
  for (var i=0; i<state.tracks.length; i++){
    var t = state.tracks[i];
    if (!t) continue;
    html += trackRowHtml(t, i);
  }
  if (!state.tracks.length){ setMsg('Список пуст'); return; }
  $('list').innerHTML = html;
  refreshCur();
  probeVisible();
}

// Дозагрузка: новые строки ПРИБАВЛЯЮТСЯ в конец DOM (как в полной версии
// VK) — без перерисовки всего списка, без прыжков скролла и мигания
function renderTracksAppend(from){
  var html = '';
  for (var i=from; i<state.tracks.length; i++){
    var t = state.tracks[i];
    if (!t) continue;
    html += trackRowHtml(t, i);
  }
  removeFoot();
  $('list').insertAdjacentHTML('beforeend', html);
  refreshCur();
  probeVisible();
}

// Проба битрейта (лениво, как в расширении; кэш в Kotlin делает повторные
// пробы дешёвыми). 1.3.23 доработка-8: окно ВИДИМОСТИ вместо «всё, что
// добавлено» — фоновая пагинация добавляет тысячи строк, а проба HLS
// качает до мегабайта на трек: вся библиотека = гигабайты впустую.
// Пробуем только строки у экрана (+запас 5/15 строк), бюджет 10 за раз;
// при скролле окно пересчитывается, бейдж появляется у строк на экране
var probeTimer = null;
function probeVisible(){
  if (probeTimer) return;
  probeTimer = setTimeout(function(){
    probeTimer = null;
    if (!state.tracks.length) return;
    var el = $('list');
    var rh = 64;
    var row0 = document.querySelector('#list .trk');
    if (row0 && row0.offsetHeight > 10) rh = row0.offsetHeight;
    var top = Math.max(0, Math.floor(el.scrollTop / rh) - 5);
    var bot = Math.min(state.tracks.length, Math.ceil((el.scrollTop + el.clientHeight) / rh) + 15);
    var budget = 10;
    for (var j = top; j < bot && budget > 0; j++){
      var tr = state.tracks[j];
      if (tr && tr.url && !tr.restricted && !state.probing[tr.rawId] && !(state.probeFails[tr.rawId] >= 2)){
        state.probing[tr.rawId] = 1;
        budget--;
        ask('probe', {rawId:tr.rawId, url:tr.url, hls:tr.hls, duration:tr.duration});
      }
    }
  }, 250);
}

function plRowHtml(p, i){
  var cover = '';
  if (p.photo && p.photo.photo_300) cover = p.photo.photo_300;
  else if (p.thumbs && p.thumbs.length && p.thumbs[p.thumbs.length-1] && p.thumbs[p.thumbs.length-1].photo_300) cover = p.thumbs[p.thumbs.length-1].photo_300;
  var cov = cover ? ' style="background-image:url(\'' + cover + '\')"' : '';
  return '<div class="pl" data-p="'+i+'">'
    + '<div class="plcov"'+cov+'></div>'
    + '<div class="meta"><div class="tt">'+esc(p.title||'Плейлист')+'</div>'
    + '<div class="ar">'+(p.count?p.count+' треков':'')+'</div></div></div>';
}

// Рендер плейлистов: from===0 — полная перерисовка, иначе добавление строк
// в конец (та же механика, что у треков). Клик — делегирование на #list
function renderPlaylists(from){
  var html = '';
  for (var i=from; i<state.playlists.length; i++){
    var p = state.playlists[i];
    if (!p) continue;
    html += plRowHtml(p, i);
  }
  if (from === 0){
    if (!state.playlists.length){ setMsg('Плейлистов нет'); return; }
    $('list').innerHTML = html;
  } else {
    removeFoot();
    $('list').insertAdjacentHTML('beforeend', html);
  }
}

// Открытие плейлиста: свежий сброс пагинации pltr и первая страница
function openPlaylist(p){
  state.openedPl = {owner:p.owner_id, id:p.id, key:p.access_key||'', title:p.title};
  $('back').style.display = 'inline-block';
  state.tracks = [];
  state.view++;
  resetPg(pg.pltr);
  pg.pltr.stamp = state.view;
  setMsg('Загрузка плейлиста…');
  updateCnt();
  pg.pltr.busy = true;
  ask('pltracks', {owner:p.owner_id, id:p.id, key:p.access_key||'', offset:0},
    function(ok, items, err, raw, total){ onTracks(pg.pltr, ok, items, err, raw, 'Плейлист пуст', total); });
}

// ------------------------------------------------------------------
// Очередь и воспроизведение: очередь живёт в СЛУЖБЕ (1.3.23 доработка).
// Страница отдаёт список играбельных треков и номер выбранного — дальше
// служба играет и переходит сама, даже когда вкладки уже нет.
// ------------------------------------------------------------------

// Трек службы по rawId (для длительности-запаски и подсветки)
function curTrack(){
  for (var i=0;i<state.tracks.length;i++){
    var t = state.tracks[i];
    if (t && t.rawId === state.natRawId) return t;
  }
  return null;
}

function playFromList(idx){
  var t = state.tracks[idx];
  if (!t || t.restricted) return;
  // собираем только играбельные — очередь в службе не должна натыкаться
  // на пустые ссылки и ограничения
  var list = [];
  var pos = -1;
  for (var i=0; i<state.tracks.length; i++){
    var tr = state.tracks[i];
    if (tr && tr.url && !tr.restricted){
      list.push(tr);
      if (i === idx) pos = list.length - 1;
    }
  }
  if (pos < 0) return;
  state.natRawId = t.rawId || '';
  state.cardRawId = state.natRawId; // карточку рисуем сами — syncPlayer по тику не нужен
  state.natHas = true;
  state.natPlaying = true; // подтверждение придёт с __vkbMusicPos
  // 1.3.23 доработка-3: новый трек — часы с нуля и секундомер заведён.
  // Без этого страховочный тикер (если пуши службы потерялись) продолжил
  // бы со старой позиции, а effDur масштабировал бы ползунок по старой
  // длительности (находка ревью P3)
  state.natPos = 0;
  state.natDur = t.duration || 0;
  state.tickAt = Date.now();
  highlightRow(idx);
  updatePlayerBar(t);
  try{
    window.VkbMusic.nativeQueue(JSON.stringify({
      tracks: list, index: pos,
      shuffle: state.shuffle ? 1 : 0, repeat: state.repeat
    }));
  }catch(e){}
}

function highlightRow(idx){
  var rawId = state.tracks[idx] ? state.tracks[idx].rawId : '';
  var rows = document.querySelectorAll('#list .trk');
  for (var i=0; i<rows.length; i++){
    var on = rows[i].getAttribute('data-raw') === rawId;
    rows[i].className = 'trk' + (on ? ' cur' : '')
      + (rows[i].getAttribute('data-restricted')==='1' ? ' restricted' : '');
    var eq = rows[i].querySelector('.eq');
    if (eq) eq.style.display = on ? 'inline-flex' : 'none';
  }
  updateTrackNo();
}

function updatePlayerBar(t){
  $('ptt').textContent = t.title || '—';
  $('par').textContent = t.artist || '';
  $('pcov').style.backgroundImage = t.cover ? "url('" + t.cover + "')" : 'none';
  $('tdur').textContent = fmt(t.duration);
}

function togglePlay(){
  // трек уже есть в службе (в т.ч. из прошлой сессии вкладки) —
  // просто переключаем паузу нативно
  if (state.natHas){
    try{
      if (state.natPlaying){
        window.VkbMusic.nativePause();
        state.natPlaying = false;
        // значок меняем сразу: на паузе тики службы могут не приходить —
        // иначе иконка «застаёт» (репорт владельца)
        $('bPlay').innerHTML = IC.play;
      } else {
        window.VkbMusic.nativeResume();
        state.natPlaying = true;
        $('bPlay').innerHTML = IC.pause;
      }
    }catch(e){}
    return;
  }
  // в службе пусто: стартуем с первого доступного трека списка —
  // служба сразу получит и очередь, и будет переключать сама
  for (var i=0; i<state.tracks.length; i++){
    var t = state.tracks[i];
    if (t && t.url && !t.restricted){ playFromList(i); return; }
  }
}

// команды медиашторки/гарнитуры: вперёд/назад — очередь СЛУЖБЫ
// (nativeShift), пауза/плей — тоже служба. Страница здесь только ретранслятор:
// служба сама разруливает, что делать, даже когда вкладки нет.
window.__vkbPlayerCmd = function(cmd){
  try{
    if (cmd==='next'){ try{ window.VkbMusic.nativeShift(1); }catch(e){} return; }
    if (cmd==='prev'){ try{ window.VkbMusic.nativeShift(-1); }catch(e){} return; }
    if (cmd==='toggle'){ togglePlay(); return; }
    if (cmd==='pause'){ try{ window.VkbMusic.nativePause(); state.natPlaying=false; $('bPlay').innerHTML = IC.play; }catch(e){} return; }
    if (cmd==='play' || cmd==='resume'){ togglePlay(); return; }
  }catch(e){}
};

// хуки службы: позицию присылает тикер каждую секунду (с rawId — какой трек
// играет). Единицы — СЕКУНДЫ (в службе lastPos/lastDur хранятся в секундах;
// раньше сюда утекали миллисекунды MediaPlayer — отсюда «белиберда» в
// таймере и ползунок в упоре после возврата из фона). «Конец трека» сюда
// больше не приходит: очередь ведёт сама служба.
window.__vkbMusicPos = function(pos, dur, playing, has, rawId){
  if (rawId) state.natRawId = rawId;
  // трек сменился, а карточный пуш потерялся (evaluateJavascript не дошёл):
  // один раз на трек перезапрашиваем карточку у службы — иначе название,
  // обложка и длительность остаются от прошлого трека (репорт владельца)
  if (rawId && rawId !== state.cardRawId){
    state.cardRawId = rawId;
    try{ if (window.VkbMusic && window.VkbMusic.syncPlayer) window.VkbMusic.syncPlayer(); }catch(e){}
  }
  state.natHas = !!has;
  state.natPlaying = !!playing;
  state.natPos = pos||0;
  state.natDur = dur||0;
  state.tickAt = Date.now(); // живой тик службы — страховочному секундомеру можно спать
  $('bPlay').innerHTML = playing ? IC.pause : IC.play;
  // трек сменён службой (автопереход) — эквалайзер/подсветка едут сразу,
  // не дожидаясь пуша карточки
  if (rawId) refreshCur();
  // сторож зависшего скраба: если drag оборвался без change/touchcancel,
  // через 10 с разрешаем позицию рисоваться снова
  if (scrub){
    if (Date.now() - scrubAt > 10000){ scrub = false; } else { return; }
  }
  var d = dur||0;
  if (!d){
    var t = curTrack();
    if (t) d = t.duration||0;
  }
  if (d > 0){
    $('seek').value = Math.min(1000, Math.max(0, Math.round(1000 * (pos||0) / d)));
    $('tcur').textContent = fmt(pos||0);
  }
};

// ------------------------------------------------------------------
// Управление плеером (кнопки и ползунок)
// ------------------------------------------------------------------
// 1.3.23 доработка-2: скраб как в полной версии VK (паттерн PinoK —
// deferred seek): пока тянешь — двигается только ползунок и время-превью,
// по отпусканию перемотка уходит в службу ОДИН раз. Раньше nativeSeek
// дёргался на каждый тик input — MediaPlayer захлёбывался seekTo, а
// ежесекундный пуш позиции одновременно откатывал ползунок назад
var scrub = false;
var scrubAt = 0; // когда последний раз двигали ползунок — сторож зависшего drag

function effDur(){
  // длительность берём из службы (трек может быть из прошлой сессии вкладки)
  var d = state.natDur;
  if (!d){
    var t = curTrack();
    if (t) d = t.duration||0;
  }
  return d;
}

$('seek').addEventListener('input', function(){
  scrub = true;
  scrubAt = Date.now();
  var d = effDur();
  if (d > 0){
    // превью времени под пальцем — как в VK
    $('tcur').textContent = fmt(d * (parseInt($('seek').value,10)/1000));
  }
});
$('seek').addEventListener('change', function(){
  var d = effDur();
  if (d > 0){
    var target = d * (parseInt($('seek').value,10)/1000);
    try{ window.VkbMusic.nativeSeek(target); }catch(e){}
    // 1.3.23 доработка-3: часы сразу на новое место — иначе при потерянных
    // пушах страховочный тикер продолжил бы с до-искной позиции (ревью P4).
    // Живые пуши службы всё равно главные — следующий тик перетрёт
    state.natPos = Math.round(target);
    state.tickAt = Date.now();
  }
  scrub = false;
});
// системный жест/входящий вызов может оборвать drag БЕЗ change — иначе
// scrub зависнет true и позиция навсегда перестанет рисоваться (находка ревью)
$('seek').addEventListener('touchcancel', function(){ scrub = false; });

$('bPlay').addEventListener('click', togglePlay);
$('bNext').addEventListener('click', function(){
  // очередь в службе — переключает она же (работает и с пустой страницей)
  try{ window.VkbMusic.nativeShift(1); }catch(e){}
});
$('bPrev').addEventListener('click', function(){
  // «назад» в службе: в начале трека — в начало, иначе предыдущий
  try{ window.VkbMusic.nativeShift(-1); }catch(e){}
});
$('bGo').addEventListener('click', scrollToCur);
$('bShuffle').addEventListener('click', function(){
  state.shuffle = !state.shuffle;
  $('bShuffle').className = 'btn pill' + (state.shuffle ? ' on' : ' off');
  // порядок обходит служба — сообщаем ей режим (текущий трек останется)
  try{ window.VkbMusic.nativeMode(state.shuffle ? 1 : 0, state.repeat); }catch(e){}
});
$('bRepeat').addEventListener('click', function(){
  state.repeat = state.repeat==='default' ? 'all' : (state.repeat==='all' ? 'one' : 'default');
  $('bRepeat').innerHTML = state.repeat==='one' ? IC.rep1 : IC.rep;
  $('bRepeat').className = 'btn pill' + (state.repeat==='default' ? ' off' : ' on');
  try{ window.VkbMusic.nativeMode(state.shuffle ? 1 : 0, state.repeat); }catch(e){}
});

// кнопка плеера: скачать тот трек, что играет сейчас
$('bDl').addEventListener('click', function(){
  try{ window.VkbMusic.downloadCurrent(); }catch(e){}
});

// кнопка «‹ ВК»: вернуться к вкладке браузера
$('exitTab').addEventListener('click', function(){
  try{ window.VkbMusic.exitTab(); }catch(e){}
});

// вкладки
var tabs = document.querySelectorAll('.tab');
for (var i=0; i<tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    for (var k=0; k<tabs.length; k++) tabs[k].className = 'tab';
    this.className = 'tab on';

    $('back').style.display = 'none';
    state.openedPl = null;
    state.tracks = [];
    state.playlists = [];

}

$('back').addEventListener('click', function(){
  state.openedPl = null;
  this.style.display = 'none';
  state.section = 'pl';
  var tabs2 = document.querySelectorAll('.tab');
  for (var k=0; k<tabs2.length; k++){
    tabs2[k].className = tabs2[k].getAttribute('data-s')==='pl' ? 'tab on' : 'tab';
  }
  loadSection();
});

// поиск — дебаунс 400 мс; загрузку делает loadSection (сброс пагинации
// раздела внутри)
$('q').addEventListener('input', function(){
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    var q = $('q').value.trim();
    if (q.length > 0){
      state.section = 'sr';
      for (var k=0; k<tabs.length; k++) tabs[k].className = 'tab';

      }
      state.tracks = [];

});

// ------------------------------------------------------------------
// Диспетчер загрузок (1.3.23 доработка): снимок из TrackDownloader,
// опрос раз в 800 мс, отмена активных задач кнопкой ✕
// ------------------------------------------------------------------
var DL_ICONS = ['⏳','⬇','✅','⚠️','🚫'];
var DL_LABELS = ['в очереди','качается','готово','ошибка','отменено'];

var lastDlSnap = '';

function renderDownloads(){
  var arr = [];
  try{ arr = JSON.parse(window.VkbMusic.getDownloads()) || []; }catch(e){ arr = []; }
  var snap = JSON.stringify(arr);
  if (snap === lastDlSnap) return; // ничего не изменилось — не перерисовываем
  lastDlSnap = snap;
  if (!arr.length){ setMsg('Скачиваний ещё не было'); return; }
  var html = '';
  for (var i=0;i<arr.length;i++){
    var t = arr[i];
    var st = t.status|0;
    var sub = DL_LABELS[st] || '';
    if (st === 1) sub = 'качается… ' + (t.progress|0) + '%';
    if (st === 2 && t.file) sub = 'готово: ' + esc(t.file);
    var bar = (st === 1) ? '<div class="dlbar"><i style="width:' + (t.progress|0) + '%"></i></div>' : '';
    var cancel = (st === 0 || st === 1)
      ? '<button class="dl" data-dlc="' + (t.id|0) + '" title="Отменить">✕</button>' : '';
    html += '<div class="dlrow"><div class="dlic">' + (DL_ICONS[st]||'⏳') + '</div>'
      + '<div class="meta"><div class="tt">' + esc(t.name) + '</div>'
      + '<div class="ar">' + sub + '</div>' + bar + '</div>' + cancel + '</div>';
  }
  $('list').innerHTML = html;
  // отмена задачи — через делегированный клик на #list (слушатель навешан
  // один раз, перерисовки ему не страшны)
}

// опрос только когда вкладка «Загрузки» открыта — лишней работы нет
setInterval(function(){
  if (state.section === 'dl') renderDownloads();
}, 800);

// 1.3.23 доработка-3: страховка таймера. Если пуши позиции из службы
// потерялись (WebView пересобран, evaluateJavascript не дошёл), а трек
// играет — секунды считает сама страница. Живые тики службы главные:
// они обновляют state.tickAt/natPos, и этот секундомер просто молчит.
setInterval(function(){
  if (!state.natHas || !state.natPlaying || scrub) return;
  if (Date.now() - (state.tickAt||0) < 3000) return; // тики живы — не мешаем
  var d = effDur();
  // трек кончился (пуши потерялись, очередь службы ушла дальше) — не считаем дальше
  if (d > 0 && (state.natPos||0) >= d) return;
  state.natPos = (state.natPos||0) + 1;
  if (d > 0){
    $('tcur').textContent = fmt(state.natPos);
    $('seek').value = Math.min(1000, Math.max(0, Math.round(1000 * state.natPos / d)));
  }
}, 1000);

// 1.3.23 доработка-7: ДОГОНЯЮЩАЯ автоподгрузка списка за плеером. Очередь
// живёт в службе и уходит за пределы загруженного списка (трек 51-й при
// загруженных 50-ти) — раньше страница об этом не знала: «⌖» писал «трека
// нет», плеер оставался без длительности-запаски из списка. Теперь если
// играет трек, которого нет в открытом списке, страница сама догружает
// страницы (только моя музыка и треки открытого плейлиста — чужие выдачи
// поиска гонять бессмысленно), пока трек не появится
setInterval(function(){
  if (!state.natRawId || curTrack()) return; // ничего не играет / трек в списке
  // догоняем только «моя музыка» и треки ОТКРЫТОГО плейлиста (открытый
  // плейлист живёт в разделе 'pl', поэтому проверка openedPl — раньше)
  if (!state.openedPl && state.section !== 'my') return;
  // бюджет: не больше 10 страниц на трек — иначе чужой трек (например,
  // играет из поиска) дренировал бы весь список, а ошибка сети давала бы
  // бесконечный шторм запросов; бюджет сбрасывается сменой трека
  if (!state.chase || state.chase.rawId !== state.natRawId){
    state.chase = { rawId: state.natRawId, left: 10 };
  }
  var p = pg.my;
  if (state.openedPl) p = pg.pltr;
  // проверка ДО декремента (находка ревью): припаркованный конец/полёт —
  // штатные состояния, бюджет не должен сгорать в тики «в пустоту»
  if (!p.more || p.busy) return;
  if (state.chase.left <= 0) return;
  state.chase.left--;
  loadMore();
}, 1200);

// Сторож зависших запросов (fail-open): ответ потерялся (сеть/WebView уснул
// посреди запроса) — busy пагинации висел бы вечно и список замер. Через
// REQ_TIMEOUT_MS считаем запрос сбойным и отдаём колбэку отказ: фоновые
// списки уходят в ретрай с бэкоффом, у остальных — кнопка «Повторить»
setInterval(function(){
  var now = Date.now();
  for (var id in state.reqKind){
    if (!state.reqKind.hasOwnProperty(id)) continue;
    var at = state.reqAt[id] || 0;
    if (!at || now - at < REQ_TIMEOUT_MS) continue;
    var cb = state.reqKind[id];
    delete state.reqKind[id];
    delete state.reqAt[id];
    if (cb){
      try{ cb(false, [], 'Таймаут загрузки', 0, 0); }catch(e){}
    }
  }
}, 5000);

// старт: моя музыка (loadSection сам сбрасывает пагинацию и вешает футер)
loadSection();

// служба могла пережить эту вкладку (закрыли/убили WebView, трек играет):
// забираем её состояние — карточка снизу оживает
try{ if (window.VkbMusic && window.VkbMusic.syncPlayer) window.VkbMusic.syncPlayer(); }catch(e){}

// Бесконечный скролл по паттерну PinoK: фоновые списки (моя музыка, треки
// плейлиста) грузятся сами цепочкой страниц (BG_PAUSE_MS между страницами);
// скролл к дну/незаполненный экран только «пинает» — пауза сокращается.
// Поиск и плейлисты — классическая догрузка: у дна (запас 500 px) следующая
// страница, короткий список докачивается до заполнения экрана. Защиту от
// повторов и дублей делает loadMore (busy/more/stamp/дедуп)
function autoLoad(){
  if (state.section === 'dl') return;
  if (!state.openedPl && state.section !== 'my' && state.section !== 'sr' && state.section !== 'pl') return;
  var p = pg.my;
  if (state.openedPl) p = pg.pltr;
  else if (state.section === 'sr') p = pg.sr;
  else if (state.section === 'pl') p = pg.pl;
  var el = $('list');
  // фоновые списки: скролл к дну / незаполненный экран — «kick» (PinoK):
  // ожидаемая фоном пауза/бэкофф отменяется, страница берётся немедленно.
  // У припаркованного конца (p.more=false) kick молчит — таймер перепроверки
  // хвоста не убивается
  if (p.bg){
    if (el.scrollHeight <= el.clientHeight + 80 || el.scrollTop + el.clientHeight >= el.scrollHeight - 500){
      if (p.more){ clearPgTimers(p); loadMore(); }
    }
    return;
  }
  if (el.scrollHeight <= el.clientHeight + 80){ loadMore(); return; }
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 500) loadMore();
}
$('list').addEventListener('scroll', autoLoad);
$('list').addEventListener('scroll', probeVisible);

// Делегированные клики списка: один слушатель на контейнер — переживает
// любые перерисовки строк (раньше слушатели вешались на строки и
// пересоздавались после каждой дозагрузки)
$('list').addEventListener('click', function(ev){
  var tg = ev.target;
  // отмена задачи загрузки (вкладка «Загрузки»)
  var canc = tg.closest ? tg.closest('[data-dlc]') : null;
  if (canc){
    ev.stopPropagation();
    try{ window.VkbMusic.cancelDownload(parseInt(canc.getAttribute('data-dlc'), 10)); }catch(e){}
    renderDownloads();
    return;
  }
  // строка плейлиста
  var pl = tg.closest ? tg.closest('.pl') : null;
  if (pl){
    var pp = state.playlists[parseInt(pl.getAttribute('data-p'), 10)];
    if (pp) openPlaylist(pp);
    return;
  }
  // строка трека: кнопка ⤓ или воспроизведение
  var row = tg.closest ? tg.closest('.trk') : null;
  if (!row) return;
  var idx = parseInt(row.getAttribute('data-i'), 10);
  var dl = tg.closest ? tg.closest('[data-dl]') : null;
  if (dl){
    ev.stopPropagation();
    var t = state.tracks[idx];
    try{
      window.VkbMusic.download(JSON.stringify({
        url:(t && t.url) ? t.url : '', hls:(t && t.hls) ? t.hls : 0,
        name:(t && t.url) ? ((t.artist?t.artist+' - ':'')+t.title) : '',
        rawId:(t && t.rawId) ? t.rawId : ''
      }));
    }catch(e){}
    return;
  }
  playFromList(idx);
});

// репорт состояния шторке больше не нужен: источник истины — служба
// ( PlaybackService сам пушит позицию в __vkbMusicPos каждую секунду)
</script>
</body>
</html>
