<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PikoVK — Музыка</title>
<script src="hls.min.js"></script>
<style>
  /* Тёмная тема в духе VK; вся вёрстка — свои элементы, ничего
     не внедряется в страницы VK (урок 1.3.21: кнопки-иконки
     накладывались на элементы трека) */
  :root{
    --bg:#141414; --bg2:#1c1c1e; --bg3:#262629; --line:#2f2f33;
    --tx:#e8e8ea; --tx2:#8b8b90; --acc:#71aaeb; --acc2:#4a76a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:14px/1.35 -apple-system,'Roboto','Segoe UI',sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* Верх: заголовок + поиск */
  .head{padding:10px 12px 8px; border-bottom:1px solid var(--line); background:var(--bg2);}
  .head .row{display:flex; align-items:center; gap:10px;}
  .head .logo{font-weight:700; font-size:15px; color:var(--tx); white-space:nowrap;}
  .head .logo span{color:var(--acc);}
  #q{
    flex:1; background:var(--bg3); border:1px solid var(--line); color:var(--tx);
    border-radius:18px; padding:8px 14px; font-size:14px; outline:none; min-width:0;
  }
  .tabs{display:flex; gap:6px; margin-top:9px;}
  .tab{
    padding:6px 14px; border-radius:15px; background:var(--bg3); color:var(--tx2);
    font-size:13px; cursor:pointer; border:none; user-select:none;
  }
  .tab.on{background:var(--acc2); color:#fff;}
  /* Список */
  #list{flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 0 12px; -webkit-overflow-scrolling:touch;}
  .trk{display:flex; align-items:center; padding:7px 12px; gap:10px; cursor:pointer;}
  .trk:active{background:var(--bg2);}
  .trk.cur{background:var(--bg3);}
  .cov{
    width:46px; height:46px; border-radius:6px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;
  }
  .meta{flex:1; min-width:0;}
  .tt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;}
  .ar{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tx2); font-size:12.5px;}
  .trk.restricted .tt,.trk.restricted .ar{color:var(--tx2); opacity:.55;}
  .side{display:flex; align-items:center; gap:8px; flex:none;}
  .dur{color:var(--tx2); font-size:12px; font-variant-numeric:tabular-nums;}
  .br{
    color:var(--acc); font-size:10.5px; border:1px solid var(--acc);
    border-radius:8px; padding:1px 5px; opacity:.85;
  }
  .dl{
    width:30px; height:30px; border-radius:15px; border:none; flex:none;
    background:var(--bg3); color:var(--tx2); font-size:15px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .dl:active{background:var(--acc2); color:#fff;}
  .eq{display:inline-flex; align-items:flex-end; gap:2px; height:14px; width:14px; flex:none;}
  .eq i{width:3px; background:var(--acc); animation:pulse 1s infinite ease-in-out;}
  .eq i:nth-child(2){animation-delay:.25s;} .eq i:nth-child(3){animation-delay:.5s;}
  @keyframes pulse{0%,100%{height:4px;} 50%{height:14px;}}
  .msg{color:var(--tx2); text-align:center; padding:28px 16px; font-size:13.5px;}
  .msg b{color:var(--tx);}
  .pl{
    display:flex; align-items:center; gap:12px; padding:8px 12px; cursor:pointer;
  }
  .pl:active{background:var(--bg2);}
  .plcov{width:56px; height:56px; border-radius:8px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;}
  .pl .meta .tt{font-weight:600;}
  .back{
    display:none; border:none; background:var(--bg3); color:var(--tx);
    border-radius:15px; padding:6px 14px; font-size:13px; cursor:pointer;
  }
  /* Низ: плеер */
  #player{border-top:1px solid var(--line); background:var(--bg2); padding:8px 12px 10px;}
  #seek{width:100%; height:4px; -webkit-appearance:none; background:var(--bg3); border-radius:2px; outline:none; margin:2px 0 8px;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:7px; background:var(--acc);}
  .prow{display:flex; align-items:center; gap:10px;}
  .pcov{width:42px; height:42px; border-radius:6px; background:var(--bg3); flex:none;
    background-size:cover; background-position:center;}
  .pmeta{flex:1; min-width:0;}
  .ptt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:13px;}
  .par{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tx2); font-size:11.5px;}
  .btn{
    width:38px; height:38px; border-radius:19px; border:none; flex:none;
    background:transparent; color:var(--tx); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .btn.main{background:var(--acc2); color:#fff; font-size:18px;}
  .btn.off{color:var(--tx2); opacity:.5;}
  .btn.on{color:var(--acc);}
  .prow2{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .time{color:var(--tx2); font-size:11px; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div class="head">
    <div class="row">
      <div class="logo">Piko<span>VK</span> Музыка</div>
      <button class="back" id="back">‹ Назад</button>
    </div>
    <div class="row" style="margin-top:9px;">
      <input id="q" type="search" placeholder="Поиск музыки…" autocomplete="off">
    </div>
    <div class="tabs">
      <button class="tab on" data-s="my">Моя музыка</button>
      <button class="tab" data-s="pl">Плейлисты</button>
      <button class="tab" data-s="sr">Поиск</button>
    </div>
  </div>

  <div id="list"><div class="msg">Загрузка…</div></div>

  <div id="player">
    <input id="seek" type="range" min="0" max="1000" value="0">
    <div class="prow">
      <div class="pcov" id="pcov"></div>
      <div class="pmeta">
        <div class="ptt" id="ptt">—</div>
        <div class="par" id="par"></div>
      </div>
      <button class="btn" id="bPrev" title="Назад">⏮</button>
      <button class="btn main" id="bPlay" title="Играть/пауза">▶</button>
      <button class="btn" id="bNext" title="Вперёд">⏭</button>
    </div>
    <div class="prow2">
      <div class="time" id="tcur">0:00</div>
      <div style="display:flex; gap:6px;">
        <button class="btn off" id="bShuffle" title="Перемешать" style="width:30px;height:30px;font-size:14px;">🔀</button>
        <button class="btn off" id="bRepeat" title="Повтор" style="width:30px;height:30px;font-size:14px;">🔁</button>
        <div class="time" id="tdur">0:00</div>
      </div>
    </div>
  </div>

<script>
'use strict';
// Экран «Музыка» PikoVK (1.3.23) — локальная копия идеи VK Music Player:
// свой плеер вне страниц VK, данные через мост VkbMusic (Kotlin).
// Очередь, шаффл, повтор, MediaSession-репорт — по образцу расширения.

var state = {
  section: 'my',        // my | pl | sr
  tracks: [],           // нормализованные треки текущего списка
  playlists: [],
  queue: [],            // очередь воспроизведения (индексы в tracks или свои объекты)
  origQueue: null,
  qi: -1,               // индекс в очереди
  shuffle: false,
  repeat: 'default',    // default | all | one
  playing: false,
  lastReq: 0,
  reqId: 0,
  reqKind: {},
  probing: {},
  openedPl: null,       // {owner, id, key, title}
  curTitle: '', curArtist: '', curPlaying: false,
  pendingSeek: 0
};

var audio = new Audio();
audio.preload = 'auto';
var hls = null;
var searchTimer = null;

function $(id){ return document.getElementById(id); }
function fmt(t){
  t = Math.max(0, Math.round(t||0));
  var h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = t%60;
  var p = function(x){ return x>=10 ? ''+x : '0'+x; };
  return (h>0 ? h+':'+p(m) : m) + ':' + p(s);
}
function esc(s){
  return (''+(s||'')).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ------------------------------------------------------------------
// Запросы в Kotlin: единый канал ответа window.__vkbMusicData
// ------------------------------------------------------------------
function ask(kind, extra, cb){
  var id = ++state.reqId;
  state.reqKind[id] = cb;
  var p = extra || {};
  p.reqId = id;
  try{
    if (kind==='tracks') window.VkbMusic.load(p.offset|0, id, p.append?1:0);
    else if (kind==='search') window.VkbMusic.search(p.q||'', p.offset|0, id, p.append?1:0);
    else if (kind==='playlists') window.VkbMusic.playlists(p.offset|0, id, p.append?1:0);
    else if (kind==='pltracks') window.VkbMusic.pltracks(JSON.stringify({owner:p.owner,id:p.id,key:p.key}), id, p.append?1:0);
    else if (kind==='probe') window.VkbMusic.probe(p.rawId, p.url, p.hls?1:0, p.duration|0, id);
  }catch(e){}
}

window.__vkbMusicData = function(r){
  if(!r) return;
  var cb = state.reqKind[r.reqId];
  if (r.kind==='bitrate'){
    delete state.reqKind[r.reqId];
    var el = document.querySelector('[data-raw="'+r.rawId+'"] .br');
    if (el && r.kbps){ el.textContent = (r.kbps<=200?'~'+r.kbps:r.kbps)+'k'; }
    return;
  }
  if (r.kind==='tracks' && cb){ delete state.reqKind[r.reqId]; cb(r.ok, r.items||[], r.error||''); return; }
  if (r.kind==='playlists' && cb){ delete state.reqKind[r.reqId]; cb(r.ok, r.items||[], r.error||''); return; }
};

// ------------------------------------------------------------------
// Списки
// ------------------------------------------------------------------
function setMsg(html){
  $('list').innerHTML = '<div class="msg">'+html+'</div>';
}

function trackRowHtml(t, idx){
  var restricted = t.restricted ? ' restricted' : '';
  var cov = t.cover ? ' style="background-image:url(\'' + t.cover + '\')"' : '';
  return '<div class="trk'+restricted+'" data-i="'+idx+'" data-raw="'+esc(t.rawId)+'">'
    + '<div class="cov"'+cov+'></div>'
    + '<div class="meta"><div class="tt">'+esc(t.title)+'</div>'
    + '<div class="ar">'+esc(t.artist)+'</div></div>'
    + '<div class="side">'
    + '<span class="br" data-br></span>'
    + '<span class="dur">'+fmt(t.duration)+'</span>'
    + (t.restricted ? '' : '<button class="dl" data-dl="'+idx+'" title="Скачать">⤓</button>')
    + '</div></div>';
}

function renderTracks(items, append){
  var cur = $('list');
  if (!append){ state.tracks = items; }
  else { for (var z=0; z<items.length; z++) state.tracks.push(items[z]); }
  if (!state.tracks.length){
    setMsg(items && items.length===0 && !append ? 'Список пуст' : 'Ничего нет');
    return;
  }
  var prevScroll = append ? cur.scrollTop : 0;
  var html = '';
  for (var i=0; i<state.tracks.length; i++){
    var t = state.tracks[i];
    if (!t) continue;
    html += trackRowHtml(t, i);
  }
  cur.innerHTML = html;
  if (append){ cur.scrollTop = prevScroll; }
  wireRows();
  // битрейт — лениво, как в расширении (кэш в Kotlin делает повторные
  // пробы дешёвыми)
  for (var j=0; j<state.tracks.length; j++){
    var tr = state.tracks[j];
    if (tr && tr.url && !state.probing[tr.rawId] && !tr.restricted){
      state.probing[tr.rawId] = 1;
      ask('probe', {rawId:tr.rawId, url:tr.url, hls:tr.hls, duration:tr.duration});
    }
  }
}

function wireRows(){
  var rows = document.querySelectorAll('#list .trk');
  for (var i=0; i<rows.length; i++){
    (function(row){
      row.addEventListener('click', function(ev){
        var dl = ev.target.closest ? ev.target.closest('[data-dl]') : null;
        var idx = parseInt(row.getAttribute('data-i'), 10);
        if (dl){
          ev.stopPropagation();
          var t = state.tracks[idx];
          if (t && t.url){
            window.VkbMusic.download(JSON.stringify({
              url:t.url, hls:t.hls, name:(t.artist?t.artist+' - ':'')+t.title, rawId:t.rawId
            }));
          } else {
            window.VkbMusic.download(JSON.stringify({url:'', name:'', rawId:''}));
          }
          return;
        }
        playFromList(idx);
      });
    })(rows[i]);
  }
}

function renderPlaylists(items, append){
  if (!append) state.playlists = items;
  else { for (var z=0; z<items.length; z++) state.playlists.push(items[z]); }
  if (!state.playlists.length){ setMsg('Плейлистов нет'); return; }
  var html = '';
  for (var i=0; i<state.playlists.length; i++){
    var p = state.playlists[i];
    if (!p) continue;
    var cover = '';
    if (p.photo && p.photo.photo_300) cover = p.photo.photo_300;
    else if (p.thumbs && p.thumbs.length && p.thumbs[p.thumbs.length-1] && p.thumbs[p.thumbs.length-1].photo_300) cover = p.thumbs[p.thumbs.length-1].photo_300;
    var cov = cover ? ' style="background-image:url(\'' + cover + '\')"' : '';
    html += '<div class="pl" data-p="'+i+'">'
      + '<div class="plcov"'+cov+'></div>'
      + '<div class="meta"><div class="tt">'+esc(p.title||'Плейлист')+'</div>'
      + '<div class="ar">'+(p.count?p.count+' треков':'')+'</div></div></div>';
  }
  $('list').innerHTML = html;
  var pls = document.querySelectorAll('#list .pl');
  for (var k=0; k<pls.length; k++){
    (function(el){
      el.addEventListener('click', function(){
        var p = state.playlists[parseInt(el.getAttribute('data-p'), 10)];
        if (!p) return;
        state.openedPl = {owner:p.owner_id, id:p.id, key:p.access_key||'', title:p.title};
        $('back').style.display = 'inline-block';
        setMsg('Загрузка плейлиста…');
        ask('pltracks', {owner:p.owner_id, id:p.id, key:p.access_key||''}, onTracks);
      });
    })(pls[k]);
  }
}

function onTracks(ok, items, err){
  if (!ok){ setMsg(err || 'Не удалось загрузить'); return; }
  renderTracks(items, false);
}

function loadSection(append){
  setMsg('Загрузка…');
  if (state.section==='my'){
    ask('tracks', {offset: state.tracks.length && append ? state.tracks.length : 0, append:append}, onTracks);
  } else if (state.section==='sr'){
    doSearch(append);
  } else {
    ask('playlists', {offset: state.playlists.length && append ? state.playlists.length : 0, append:append}, function(ok, items, err){
      if (!ok){ setMsg(err || 'Не удалось загрузить'); return; }
      renderPlaylists(items, append);
    });
  }
}

function doSearch(append){
  var q = $('q').value.trim();
  if (!q){ setMsg('Введите запрос'); return; }
  ask('search', {q:q, offset: append ? state.tracks.length : 0, append:append}, onTracks);
}

// ------------------------------------------------------------------
// Очередь и воспроизведение (по образцу VK Music Player)
// ------------------------------------------------------------------
function shuffleArr(a){
  for (var i=a.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}

function setQueueFromList(startIdx){
  var q = [];
  for (var i=0; i<state.tracks.length; i++) q.push(i);
  state.origQueue = null;
  if (state.shuffle){
    state.origQueue = q.slice();
    q = shuffleArr(q.slice());
    var pos = q.indexOf(startIdx);
    if (pos > 0){ var x = q[pos]; q.splice(pos,1); q.unshift(x); pos = 0; }
  }
  state.queue = q;
  state.qi = q.indexOf(startIdx);
}

function playFromList(idx){
  var t = state.tracks[idx];
  if (!t || t.restricted) return;
  setQueueFromList(idx);
  playCurrent(0);
}

function playCurrent(seekSec){
  var idx = state.queue[state.qi];
  if (idx === undefined || idx < 0) return;
  var t = state.tracks[idx];
  if (!t || !t.url) return;
  loadIntoAudio(t, seekSec || 0);
  state.curTitle = t.title; state.curArtist = t.artist;
  reportState(true);
  highlightRow(idx);
  updatePlayerBar(t);
}

function loadIntoAudio(t, seekSec){
  try{
    if (hls){ hls.destroy(); hls = null; }
  }catch(e){}
  audio.pause();
  state.pendingSeek = seekSec || 0;
  if (t.hls && window.Hls && window.Hls.isSupported()){
    hls = new window.Hls({
      maxBufferLength: 30, maxMaxBufferLength: 600, maxBufferHole: 2,
      fragLoadingRetryDelay: 500, manifestLoadingRetryDelay: 1000,
      manifestLoadingMaxRetry: 3
    });
    hls.on(window.Hls.Events.MANIFEST_PARSED, function(){
      try{
        if (state.pendingSeek > 0){ audio.currentTime = state.pendingSeek; }
        audio.play();
      }catch(e){}
    });
    hls.on(window.Hls.Events.ERROR, function(ev, data){
      try{
        if (data && data.fatal && window.Hls){
          if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); }
          else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
          else { audio.dispatchEvent(new Event('ended')); }
        }
      }catch(e){}
    });
    hls.loadSource(t.url);
    hls.attachMedia(audio);
  } else {
    audio.src = t.url;
    var go = function(){
      try{
        if (state.pendingSeek > 0){ audio.currentTime = state.pendingSeek; }
        audio.play();
      }catch(e){}
      audio.removeEventListener('loadedmetadata', go);
    };
    audio.addEventListener('loadedmetadata', go);
    try{ audio.load(); }catch(e){}
  }
}

function highlightRow(idx){
  var rawId = state.tracks[idx] ? state.tracks[idx].rawId : '';
  var rows = document.querySelectorAll('#list .trk');
  for (var i=0; i<rows.length; i++){
    var on = rows[i].getAttribute('data-raw') === rawId;
    rows[i].className = 'trk' + (on ? ' cur' : '');
  }
}

function updatePlayerBar(t){
  $('ptt').textContent = t.title || '—';
  $('par').textContent = t.artist || '';
  $('pcov').style.backgroundImage = t.cover ? "url('" + t.cover + "')" : 'none';
  $('tdur').textContent = fmt(t.duration);
}

function togglePlay(){
  if (state.qi < 0 || !state.queue.length){
    // ничего не выбрано — играем первый доступный трек списка
    for (var i=0; i<state.tracks.length; i++){
      var t = state.tracks[i];
      if (t && t.url && !t.restricted){ playFromList(i); return; }
    }
    return;
  }
  try{
    if (audio.paused){ audio.play(); } else { audio.pause(); }
  }catch(e){}
}

function shift(dir){
  if (!state.queue.length) return;
  var n = state.qi + dir;
  if (n >= state.queue.length){
    if (state.repeat === 'all'){ n = 0; } else { return; }
  }
  if (n < 0){
    n = state.repeat === 'all' ? state.queue.length - 1 : 0;
  }
  state.qi = n;
  playCurrent(0);
}

// репорт в медиашторку: только при изменении (как PLAYER_JS, 1.3.21)
function reportState(force){
  if (!window.VkbMusic || !window.VkbMusic.playerState) return;
  var playingNow = !audio.paused && !audio.ended;
  if (force || playingNow !== state.curPlaying
      || state.curTitle !== ($('ptt').textContent||'')){
    state.curPlaying = playingNow;
    try{
      window.VkbMusic.playerState($('ptt').textContent || '', $('par').textContent || '', playingNow ? '1' : '0');
    }catch(e){}
  }
}

// команды медиашторки/гарнитуры: тот же протокол, что у PLAYER_JS (1.3.21),
// чтобы PlaybackService не менялся
window.__vkbPlayerCmd = function(cmd){
  try{
    if (cmd==='next'){ shift(1); return; }
    if (cmd==='prev'){ shift(-1); return; }
    if (cmd==='toggle'){ togglePlay(); return; }
    if (cmd==='pause'){ try{ audio.pause(); }catch(e){} return; }
    if (cmd==='play' || cmd==='resume'){ try{ audio.play(); }catch(e){} return; }
  }catch(e){}
};

// ------------------------------------------------------------------
// События аудио
// ------------------------------------------------------------------
audio.addEventListener('play', function(){ $('bPlay').textContent = '⏸'; reportState(true); });
audio.addEventListener('pause', function(){ $('bPlay').textContent = '▶'; reportState(true); });
audio.addEventListener('ended', function(){
  if (state.repeat === 'one'){ playCurrent(0); return; }
  var n = state.qi + 1;
  if (n >= state.queue.length){
    if (state.repeat === 'all'){ n = 0; } else { $('bPlay').textContent = '▶'; reportState(true); return; }
  }
  state.qi = n;
  playCurrent(0);
});
audio.addEventListener('timeupdate', function(){
  var d = audio.duration || (state.queue.length ? 0 : 0);
  var idx = state.queue[state.qi];
  var t = state.tracks[idx];
  if (!d || d <= 0) d = t ? t.duration : 0;
  if (d > 0){
    $('seek').value = Math.round(1000 * (audio.currentTime||0) / d);
    $('tcur').textContent = fmt(audio.currentTime||0);
  }
});

$('seek').addEventListener('input', function(){
  var d = audio.duration;
  if (d && d > 0){
    try{ audio.currentTime = d * (parseInt($('seek').value,10)/1000); }catch(e){}
  }
});

$('bPlay').addEventListener('click', togglePlay);
$('bNext').addEventListener('click', function(){ shift(1); });
$('bPrev').addEventListener('click', function(){
  // как у обычных плееров: в начале трека — в начало, иначе — предыдущий
  if (audio.currentTime > 3){ try{ audio.currentTime = 0; }catch(e){} }
  else { shift(-1); }
});
$('bShuffle').addEventListener('click', function(){
  state.shuffle = !state.shuffle;
  $('bShuffle').className = 'btn' + (state.shuffle ? ' on' : ' off');
  if (state.shuffle){
    state.origQueue = state.queue.slice();
    var q = state.queue.slice();
    q = shuffleArr(q);
    if (state.qi >= 0){
      var pos = q.indexOf(state.queue[state.qi]);
      if (pos > 0){ var x = q[pos]; q.splice(pos,1); q.unshift(x); }
    }
    state.queue = q;
    state.qi = q.length ? 0 : -1;
  } else {
    if (state.origQueue){
      var curRaw = state.queue[state.qi] !== undefined ? state.queue[state.qi] : -1;
      state.queue = state.origQueue.slice();
      state.qi = state.queue.indexOf(curRaw);
    }
  }
});
$('bRepeat').addEventListener('click', function(){
  state.repeat = state.repeat==='default' ? 'all' : (state.repeat==='all' ? 'one' : 'default');
  $('bRepeat').className = 'btn' + (state.repeat==='default' ? ' off' : ' on');
  $('bRepeat').textContent = state.repeat==='one' ? '🔂' : '🔁';
});

// вкладки
var tabs = document.querySelectorAll('.tab');
for (var i=0; i<tabs.length; i++){
  tabs[i].addEventListener('click', function(){
    for (var k=0; k<tabs.length; k++) tabs[k].className = 'tab';
    this.className = 'tab on';
    state.section = this.getAttribute('data-s');
    $('back').style.display = 'none';
    state.openedPl = null;
    state.tracks = [];
    state.playlists = [];
    loadSection(false);
  });
}

$('back').addEventListener('click', function(){
  state.openedPl = null;
  this.style.display = 'none';
  state.section = 'pl';
  var tabs2 = document.querySelectorAll('.tab');
  for (var k=0; k<tabs2.length; k++){
    tabs2[k].className = tabs2[k].getAttribute('data-s')==='pl' ? 'tab on' : 'tab';
  }
  loadSection(false);
});

// поиск — дебаунс 400 мс
$('q').addEventListener('input', function(){
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    var q = $('q').value.trim();
    if (q.length > 0){
      state.section = 'sr';
      for (var k=0; k<tabs.length; k++) tabs[k].className = 'tab';
      for (var k2=0; k2<tabs.length; k2++){
        if (tabs[k2].getAttribute('data-s')==='sr'){ tabs[k2].className = 'tab on'; }
      }
      state.tracks = [];
      doSearch(false);
    }
  }, 400);
});

// старт: моя музыка
setMsg('Загрузка…');
ask('tracks', {offset:0}, onTracks);

// бесконечный скролл: у дна докачиваем следующую пачку (моя музыка/поиск)
state.loadingMore = false;
$('list').addEventListener('scroll', function(){
  var el = $('list');
  if (state.loadingMore) return;
  if (el.scrollTop + el.clientHeight < el.scrollHeight - 400) return;
  if (state.section==='my' || state.section==='sr'){
    if (state.section==='sr' && !$('q').value.trim()) return;
    state.loadingMore = true;
    loadSection(true);
    setTimeout(function(){ state.loadingMore = false; }, 1500);
  }
});

// репорт состояния шторке раз в 3 с (на случай пропуска событий)
setInterval(function(){ reportState(false); }, 3000);
</script>
</body>
</html>
